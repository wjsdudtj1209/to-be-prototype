<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="TO-BE"><meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><title>매직미키마우스 TO-BE 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  매직미키마우스 · Project Managing (2026-2학기) 수업 과제
  리셀 앱 구매 · 판매 흐름의 TO-BE 프로토타입 — 팀원 검토용 공유판(2026-10-17)
  실제 서비스와 관계없고, 결제 · 판매는 일어나지 않습니다. 숫자는 모두 테스트용 예시입니다.
-->
<style>
:root{
  --text:#222;--sub:rgba(34,34,34,.5);--sub2:rgba(34,34,34,.8);--line:#ebebeb;--line2:#f0f0f0;
  --gray:#f4f4f4;--gray2:#fafafa;--red:#ef6253;--green:#41b979;--fast:#31b46e;--blue:#6155f5;
  --dark:#222;--dim:rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e9e9ec;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
/* iPhone 17 화면(402 × 874pt) 비율. 넓은 화면에서는 기기 틀에 넣고 창 높이에 맞춰 줄인다(fitPhone). 휴대폰에서는 화면 전체 */
#stage{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#phone{position:relative;width:100%;height:100%;background:#fff;overflow:hidden;flex:none;--framed:0;--sat:0px;--sab:env(safe-area-inset-bottom, 0px)}
#sbar,#hbar{display:none}
@media (min-width:560px){
  #phone{--framed:1;--sat:62px;--sab:34px;width:424px;height:896px;border-radius:66px;border:11px solid #141414;box-shadow:0 0 0 2px #3a3a3c,0 24px 70px rgba(0,0,0,.28);transform-origin:center}
  #sbar,#hbar{display:block}
}
#sbar{position:absolute;left:0;right:0;top:0;height:var(--sat);z-index:70;pointer-events:none;color:#000}
#sbar .tm{position:absolute;left:46px;top:20px;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#sbar .di{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
#sbar .ic2{position:absolute;right:30px;top:22px;display:flex;gap:6px;align-items:center}
#hbar{position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:#111;z-index:70;pointer-events:none}
#app{position:absolute;inset:0;overflow:hidden}
#screens{position:absolute;inset:0;z-index:1}
.dimbg,.sheet{z-index:5}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hd{height:52px;flex:none;display:flex;align-items:center;padding:0 8px;gap:2px;background:#fff;position:relative;z-index:2}
.hd .t{position:absolute;left:56px;right:56px;text-align:center;font-weight:700;font-size:16px;pointer-events:none}
.hd .sp{flex:1}
.ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:20px}
.ic svg{width:24px;height:24px}
.pill{border:1px solid var(--line);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600}
.sec{padding:20px 16px;border-top:8px solid var(--gray2)}
.sec.thin{border-top:1px solid var(--line)}
.sec h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:4px}
.sub{color:var(--sub)}
.u{text-decoration:underline;text-underline-offset:2px}
.red{color:var(--red)}.green{color:var(--green)}.fastc{color:var(--fast)}
.bold{font-weight:700}
.row{display:flex;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}
.chev{width:8px;height:14px;opacity:.35}
.chev2{width:16px;height:16px;opacity:.4}

/* product */
.pimg{position:relative;background:#f6eeed;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.pimg svg{width:72%}
.pimg .sim{position:absolute;right:12px;bottom:14px;background:rgba(255,255,255,.9);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600}
.pimg .dots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:4px}
.pimg .dots i{width:14px;height:2px;background:rgba(0,0,0,.15)}.pimg .dots i:first-child{background:#222}
.thumbs{display:flex;gap:8px;padding:12px 16px}
.thumbs div{width:52px;height:52px;border-radius:8px;background:#f4f4f4;display:flex;align-items:center;justify-content:center}
.thumbs div svg{width:44px}
.pinfo{padding:12px 16px 16px}
.pinfo .retail{font-size:13px;color:var(--sub)}
.pinfo .price{font-size:20px;font-weight:800;margin-top:2px}
.pinfo .price .pct{color:var(--red);margin-right:4px}
.pinfo .nm{font-size:15px;margin-top:14px}
.pinfo .en{font-size:13px;color:var(--sub);margin-top:2px}
.pinfo .rate{font-size:14px;margin-top:12px;display:flex;gap:6px;align-items:center}
.pinfo .ranks{font-size:13px;margin-top:14px}
.trust{display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.trust .k{width:18px;height:18px;border-radius:4px;background:#222;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900}
.trust .d{color:var(--sub);font-weight:400}
.deliv{display:block;width:100%;padding:16px}
.deliv .r{display:flex;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.deliv .r .ico{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center}
.deliv .r b{font-weight:700;min-width:56px}
.spec{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 8px;padding:16px;border-top:1px solid var(--line)}
.spec div{font-size:12px;color:var(--sub)}.spec div b{display:block;color:var(--text);font-weight:500;font-size:13px;margin-top:3px}
.benefit{display:flex;justify-content:space-between;padding:14px 16px;font-size:13px;border-top:1px solid var(--line)}
.mk-top{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.mk-top .cnt{font-size:16px;font-weight:700}
.chg{font-size:13px}
.optsel{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.optsel .dn{width:18px;height:18px;border-radius:9px;background:#f4f4f4;display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:var(--gray);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;text-align:center;padding:7px 0;font-size:13px;border-radius:8px;color:var(--sub2)}
.seg button.on{background:#fff;font-weight:700;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tb{width:100%;font-size:13px}
.tb .th,.tb .tr{display:grid;grid-template-columns:1fr 1.3fr 1fr;padding:7px 0}
.tb .th{color:var(--sub);font-size:12px;border-bottom:1px solid var(--line)}
.tb .th span:not(:first-child),.tb .tr span:not(:first-child){text-align:right}
.tb .th button{font-size:12px;color:var(--sub)}
.tb .th button.on{color:var(--text);font-weight:700}
.tb .tr .fz{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.tb .empty{padding:36px 0;text-align:center;color:var(--sub);font-size:13px}
.more{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px;margin-top:12px}
.fit{margin-top:6px}
.fit .f{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.rv{border-top:1px solid var(--line2);padding:14px 0;font-size:13px}
.rv .m{color:var(--sub);font-size:12px;margin:4px 0 6px}
.exh{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.exh div{flex:none;width:160px;border-radius:12px;background:var(--gray);padding:14px;font-size:13px;font-weight:600;line-height:1.4;height:96px}
.exh div small{display:block;font-weight:400;color:var(--sub);margin-top:6px}
.c95{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.c95 button{flex:none;width:120px}
.c95 .im{position:relative;width:120px;height:120px;border-radius:10px;background:#f6eeed;display:flex;align-items:center;justify-content:center}
.c95 .im svg{width:88px}
.badge95{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d4d4d4;border-radius:10px;padding:0 6px;height:18px;font-size:11px;font-weight:700;background:#fff}
.c95 .im .badge95{position:absolute;left:6px;top:6px}
.c95 .sz{font-size:13px;margin-top:8px}
.c95 .pr{font-size:14px;font-weight:700;margin-top:2px}
.c95 .dc{color:var(--red);font-size:12px;margin-right:3px}
.brand{display:flex;align-items:center;gap:10px;padding:16px;border-top:1px solid var(--line)}
.brand .lg{width:40px;height:40px;border-radius:20px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.stbl{overflow-x:auto}
.stbl table{border-collapse:collapse;font-size:12px;white-space:nowrap}
.stbl td,.stbl th{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line2)}
.stbl th{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;color:var(--sub2)}
.note{font-size:11px;color:var(--sub);line-height:1.5;margin-top:10px}
.acc button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;border-top:1px solid var(--line);font-size:14px}
.pfoot{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + var(--sab, 0px));border-top:1px solid var(--line);background:#fff}
.pfoot .mini{width:40px;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:1px}
.pfoot .mini svg{width:22px;height:22px}
.btn{height:52px;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.2;text-align:center}
.btn small{font-size:11px;font-weight:500;opacity:.9}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.dark{background:var(--dark);color:#fff}
.btn.outline{border:1px solid #d3d3d3;color:var(--text);font-weight:600}
.btn[disabled],.btn.dis{background:#ebebeb!important;color:#fff!important;cursor:default}
.pfoot .sell{width:88px}
.pfoot .buy{flex:1}

/* sheets */
.dimbg{position:absolute;inset:0;background:var(--dim);animation:fi .18s}
.dimbg+.dimbg,.sheet~.dimbg{background:rgba(0,0,0,.25)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;animation:su .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.full{top:4%;max-height:none}
.sheet.center{left:24px;right:24px;bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px;animation:fi .18s}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.handle{width:40px;height:4px;border-radius:2px;background:#d9d9d9;margin:10px auto 0;flex:none}
.sh-t{text-align:center;font-weight:700;font-size:16px;padding:14px 48px 4px;position:relative}
.sh-t small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px}
.sh-x{position:absolute;right:8px;top:4px}
.sh-body{overflow-y:auto;flex:1;padding:0 16px 16px}
.prow{display:flex;gap:12px;align-items:center;padding:12px 16px}
.prow .im{width:64px;height:64px;border-radius:10px;background:#f6eeed;flex:none;display:flex;align-items:center;justify-content:center}
.prow .im svg{width:54px}
.prow .ko{font-size:14px}
.prow .en{font-size:12px;color:var(--sub);margin-top:2px}
.prow .md{font-size:12px;color:var(--sub);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.sz{border:1px solid var(--line);border-radius:10px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sz b{font-size:15px;font-weight:500;display:flex;align-items:center;gap:1px}
.sz .p{font-size:12px}
.sz .p.none{color:var(--sub);font-size:12px}
.sz.on{border:1.5px solid #222}.sz.on b{font-weight:800}.sz.on .p{font-weight:700}
.bolt{width:12px;height:14px;flex:none}
.panel{flex:none;border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.06);border-radius:18px 18px 0 0;padding:4px 16px calc(12px + var(--sab, 0px));background:#fff}
.rt{display:flex;align-items:center;gap:10px;padding:12px 2px;width:100%}
.radio{width:20px;height:20px;border-radius:10px;border:1.5px solid #cfcfcf;flex:none;position:relative}
.radio.on{border:6px solid #222}
.rt .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.rt .ds{font-size:13px;color:var(--sub);flex:1}
.rt .pr{font-size:14px}
.rt.on .pr{color:var(--red);font-weight:700}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0;font-size:14px}
.opt.on{border:1.5px solid #222}
.opt .pr{font-weight:700}
.opt.on .pr{color:var(--red)}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1}

/* confirm */
.pdec{padding:0 16px}
.plist{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.plist li{list-style:none;flex:1;padding:14px 0;text-align:center}
.plist li+li{border-left:1px solid var(--line)}
.plist .t{font-size:12px;color:var(--sub)}
.plist .v{font-size:15px;font-weight:700;margin-top:4px}
.tabs2{display:flex;background:var(--gray);border-radius:10px;padding:2px}
.tabs2 button{flex:1;text-align:center;padding:10px 0;font-size:14px;border-radius:8px;color:var(--sub2)}
.tabs2 button.on{background:#fff;font-weight:700;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs2 button[disabled]{opacity:.35;cursor:default}
.pnow{padding:20px 0 10px;border-bottom:2px solid #222;margin-top:16px}
.pnow.focus{border-color:#222}
.pnow.warn{border-color:var(--red)}
.pnow .t{font-size:13px;font-weight:700}
.pnow .v{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;margin-top:6px}
.pnow .v .amt{font-size:22px;font-weight:800}
.pnow .v input{border:0;outline:0;text-align:right;font-size:22px;font-weight:800;width:100%;background:transparent}
.pnow .v input::placeholder{color:#d0d0d0;font-weight:700}
.pnow .v .unit{font-size:20px;font-weight:700}
.pwarn{color:var(--red);font-size:12px;margin-top:6px;min-height:16px}
.bind{padding:10px 0 4px}
.bind .empty{font-size:13px;color:var(--sub);padding:8px 0}
.line{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0}
.line .k{color:var(--sub2);display:flex;align-items:center;gap:4px}
.line .k button{display:inline-flex}
.line .v{font-weight:500}
.dl{padding:20px 16px;border-top:8px solid var(--gray2)}
.dl h3{font-size:15px;font-weight:700}
.dl .txt{font-size:14px;margin:10px 0 12px}
.dl .opts{display:flex;flex-wrap:wrap;gap:6px}
.dl .opts button{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.dl .opts button.on{border:1.5px solid #222;font-weight:700}
.cpol{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;border-top:8px solid var(--gray2);font-size:14px}
.cfoot{flex:none;padding:10px 16px calc(10px + var(--sab, 0px));border-top:1px solid var(--line);background:#fff}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 10px}
.tot .t{font-size:14px;font-weight:700}
.tot .v{font-size:18px;font-weight:800}
.tot .v.ph{font-size:13px;color:var(--sub);font-weight:400}
.cfoot .btn{width:100%}
.cfoot .hint{text-align:center;font-size:13px;margin-bottom:10px}
.cfoot .hint b{color:var(--blue)}

/* checkout */
.co{background:#f5f5f7}
.co .body{background:#f5f5f7}
.blk{padding:20px 16px 4px}
.blk .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.blk .bh h3{font-size:17px;font-weight:800}
.card{background:#fff;border-radius:14px;padding:16px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:10px 8px;font-size:14px}
.kv .k{color:var(--sub)}
.memo{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px;font-size:14px}
.warnbox{color:var(--red);font-size:14px;font-weight:600;line-height:1.5}
.cnote{font-size:12px;color:var(--sub);padding:10px 2px 0;line-height:1.5}
.cnote em{color:var(--red);font-style:normal}
.dm{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.dm.on{border:1.5px solid #222}
.dm .a{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.dm .b{font-size:12px;color:var(--sub);margin-top:4px}
.coupon{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:14px;font-size:14px;color:var(--sub);margin-bottom:8px}
.tg{width:44px;height:26px;border-radius:13px;background:#d9d9d9;position:relative}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:10px;background:#fff}
.oi{display:flex;gap:12px;align-items:center}
.oi .im{width:72px;height:72px;border-radius:10px;background:#f6eeed;display:flex;align-items:center;justify-content:center;flex:none}
.oi .im svg{width:60px}
.oi .nm{font-size:13px}
.oi .en{font-size:12px;color:var(--sub);margin-top:2px}
.oi .op{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:8px}
.pm{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;font-size:14px}
.pm.on{border:1.5px solid #222}
.pm .x{font-size:12px;color:var(--sub)}
.pm .r{display:flex;align-items:center;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:-2px 0 10px}
.pgrid button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 0;text-align:center;font-size:13px}
.pgrid button.on{border:1.5px solid #222;font-weight:700}
.fin .line{font-size:14px;padding:7px 0}
.fin .sum{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.fin .sum .t{font-weight:800;font-size:15px}
.fin .sum .v{font-weight:800;font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px 0;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.5}
.chk:last-child{border-bottom:0}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid #cfcfcf;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cb.on{background:#222;border-color:#222}
.cb.on svg{display:block}.cb svg{display:none;width:14px;height:14px}
.chk .tt{font-weight:700;font-size:14px}
.chk .dd{color:var(--sub);margin-top:2px}

function chartSvg(opt, period){
  const days = {m1:30,m3:90,m6:180,y1:365,all:1e9}[period];
  const pts = tradesOf(opt).filter(t => (NOW-t.ts)/DAY <= days);
  const W = 300, H = 150, PX = 8;
  if (pts.length < 2) return `<svg class="chart" viewBox="0 0 360 ${H}"><text x="180" y="${H/2}" text-anchor="middle" class="yl" style="font-size:12px">체결된 거래가 아직 없습니다.</text></svg>`;
  const map = new Map(); pts.forEach(t => { const d = Math.floor((NOW-t.ts)/DAY); const a = map.get(d)||[0,0]; a[0]+=t.price; a[1]++; map.set(d,a); });
  const arr = [...map.entries()].map(([d,[s,c]])=>({d, v:s/c})).sort((a,b)=>b.d-a.d);
  const maxD = Math.max(1, Math.min(days, arr[0].d));
  let lo = Math.min(...arr.map(a=>a.v)), hi = Math.max(...arr.map(a=>a.v));
  const steps = [1000,2000,5000,10000,20000,40000,50000,100000];
  const step = steps.find(s => (hi-lo)/s <= 4) || 100000;
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step; if (hi===lo) hi = lo+step;
  const x = d => (maxD - Math.min(d,maxD))/maxD*W, y = v => PX + (hi - v)/(hi - lo)*(H-2*PX);
  let path = ""; arr.forEach((a,i)=>{ const X=x(a.d).toFixed(1), Y=y(a.v).toFixed(1); path += (i?` H${X} V${Y}`:`M${X} ${Y}`); });
  const ticks = []; for (let v=lo; v<=hi; v+=step) ticks.push(v);
  return `<svg class="chart" viewBox="0 0 360 ${H}">
    ${ticks.map(v=>`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#f2f2f2"/><text x="${W+8}" y="${y(v)+3}" class="yl">${won(v)}</text>`).join("")}
    <path d="${path}" fill="none" stroke="#ef6253" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

/* price inputs: 입력 중에는 콤마·최소 금액 경고, 포커스 해제 시 천원 단위 보정과 즉시 거래 전환 (입력 동작)
   화면 전체를 다시 그리면 바로 누른 버튼 탭이 사라지므로, 탭 전환이 없을 때는 필요한 부분만 고친다. */
function parseNum(v){ return Number(String(v).replace(/\D/g,"").slice(0,10)) || 0; }
const WARN = "2만원 부터 천원단위로 입력하세요.";
function syncPrice(kind){
  const st = kind==="bc" ? S.bc : S.sc;
  const w = $(kind==="bc"?"#bcWarn":"#scWarn"); if (w) w.textContent = st.warn ? WARN : "";
  const p = document.querySelector(".pnow"); if (p) p.classList.toggle("warn", !!st.warn);
  const g = $(kind==="bc"?"#bcGo":"#scGo"); if (g) g.disabled = st.mode==="bid" && !st.valid;
  if (kind==="sc"){ const n = scNumbers();
    $("#scFee").textContent = n.fee!=null ? "-"+won(n.fee)+"원" : "-";
    $("#scPay").textContent = n.payout!=null ? won(n.payout)+"원" : "-원";
    $("#scFeeK").textContent = "수수료";
    if ($("#scIns")) $("#scIns").textContent = n.price ? "무료" : "-";
    const cm = $("#cmp2"); if (cm) cm.innerHTML = cmp2Html(); }
  if (kind==="bc"){ const bb = $("#bcBind"); if (bb) bb.innerHTML = bcBindHtml();
    const bt = $("#bcTot"); if (bt){ const n = bcNums(); bt.textContent = n ? won(n.total)+"원" : "-"; } }
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.in) return;
  const n = parseNum(el.value); el.value = n ? n.toLocaleString("ko-KR") : "";
  const kind = el.dataset.in==="bcPrice" ? "bc" : "sc", st = kind==="bc" ? S.bc : S.sc;
  st.price = n || null; st.valid = n >= DATA.minBid; st.warn = n > 0 && n < DATA.minBid;
  syncPrice(kind);
});
document.addEventListener("focusout", e => {
  const el = e.target; if (!el.dataset.in) return;
  const kind = el.dataset.in==="bcPrice" ? "bc" : "sc", st = kind==="bc" ? S.bc : S.sc, z = sizeOf(st.size);
  let n = parseNum(el.value);
  const who = kind==="bc" ? "구매 희망가" : "판매 희망가";
  if (!n){ st.price=null; st.valid=false; st.warn=false; syncPrice(kind); return; }
  if (n < DATA.minBid){ st.price=n; st.valid=false; st.warn=true; log(`${who} 입력: ${won(n)} (최소 미만)`); syncPrice(kind); return; }
  n = Math.floor(n/1000)*1000;
  const toInstant = kind==="bc" ? (z.normal!=null && n >= z.normal) : (z.bid!=null && n <= z.bid);
  if (toInstant){ st.mode="instant"; st.price=null; st.valid=false; st.warn=false;
    log(`${who} ${won(n)} 입력 → ${kind==="bc"?"즉시 구매":"즉시 판매"}로 자동 전환`); render(); return; }
  st.price=n; st.valid=true; st.warn=false; el.value = won(n); log(`${who} 입력: ${won(n)}원`); syncPrice(kind);
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.dataset && e.target.dataset.in) e.target.blur(); });

/* TO-BE(10/17): 바텀시트를 아래로 끌어서 닫기 (터치 · 마우스). 내용이 맨 위일 때만 끌리고, 아니면 평소처럼 스크롤 */
let DRAG = null, NOCLICK = 0;
function topSheet(){ const s = document.querySelectorAll("#overlay .sheet"); return s[s.length - 1] || null; }
function dStart(y, target){
  if (closing || !target.closest) return;
  const sh = target.closest("#overlay .sheet");
  if (!sh || sh !== topSheet() || sh.classList.contains("center") || target.closest("input,textarea")) return;
  const pn = target.closest(".panel");  // 시트 안 배송 패널은 패널만 끌려 내려감
  DRAG = {sh, pn, dim: pn ? null : sh.previousElementSibling, y0: y, t0: performance.now(), dy: 0, sc: pn ? null : target.closest(".sh-body,.dr-body"), on: false};
}
function dMove(y){
  const d = DRAG; if (!d) return false;
  d.dy = y - d.y0;
  if (!d.on){
    if (Math.abs(d.dy) < 6) return false;
    if (d.dy < 0 || (d.sc && d.sc.scrollTop > 0)){ DRAG = null; return false; }
    d.on = true; (d.pn || d.sh).style.transition = "none"; (d.pn || d.sh).style.willChange = "transform"; if (d.dim) d.dim.style.willChange = "opacity"; document.body.style.userSelect = "none";
  }
  if (!d.h) d.h = d.sh.offsetHeight;  // 끄는 동안 높이를 다시 재지 않음
  if (!d.raf) d.raf = requestAnimationFrame(() => { d.raf = 0;  // 마우스 · 터치 이벤트가 많아도 한 프레임에 한 번만 옮김
    const dy = Math.max(0, d.dy) / PHS;  // 기기 틀을 줄여 보여 줄 때도 손가락을 그대로 따라오게
    (d.pn || d.sh).style.transform = `translate3d(0,${dy}px,0)`;
    if (d.dim) d.dim.style.opacity = String(Math.max(0, 1 - dy / d.h)); });
  return true;
}
function dEnd(cancel){
  const d = DRAG; DRAG = null; if (!d || !d.on) return;
  if (d.raf) cancelAnimationFrame(d.raf); (d.pn || d.sh).style.willChange = ""; if (d.dim) d.dim.style.willChange = "";
  document.body.style.userSelect = "";
  NOCLICK = performance.now() + 350;
  const v = d.dy / Math.max(1, performance.now() - d.t0);
  if (d.pn){
    const ph = d.pn.offsetHeight, dy = d.dy / PHS;
    if (!cancel && (dy > ph * 0.25 || (v > 0.55 && d.dy > 40))){
      if (d.pn.animate && !REDUCE()) d.pn.animate([{transform: `translateY(${dy}px)`}, {transform: "translateY(100%)"}], {duration: 200, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards"}).onfinish = () => A.panelDown();
      else A.panelDown();
      return;
    }
    d.pn.style.transition = "transform .24s cubic-bezier(.2,.8,.2,1)"; d.pn.style.transform = "";
    setTimeout(() => { d.pn.style.transition = ""; }, 260);
    return;
  }
  if (!cancel && (d.dy / PHS > d.sh.offsetHeight * 0.22 || (v > 0.55 && d.dy > 40))){ log("시트를 아래로 밀어 닫음"); closeSheet(d.dy / PHS); return; }
  d.sh.style.transition = "transform .24s cubic-bezier(.2,.8,.2,1)"; d.sh.style.transform = "";
  if (d.dim){ d.dim.style.transition = "opacity .24s"; d.dim.style.opacity = ""; }
  setTimeout(() => { d.sh.style.transition = ""; if (d.dim) d.dim.style.transition = ""; }, 260);
}
document.addEventListener("touchstart", e => { if (e.touches.length === 1) dStart(e.touches[0].clientY, e.target); }, {passive: true});
document.addEventListener("touchmove", e => { if (DRAG && dMove(e.touches[0].clientY)) e.preventDefault(); }, {passive: false});
document.addEventListener("touchend", () => dEnd(false));
document.addEventListener("touchcancel", () => dEnd(true));
// 마우스로 끌 때 글자 선택 · 사진 끌기가 같이 시작되지 않게
document.addEventListener("mousedown", e => { if (e.button === 0){ dStart(e.clientY, e.target); if (DRAG && !e.target.closest("input,textarea")) e.preventDefault(); } });
document.addEventListener("mousemove", e => { if (DRAG) dMove(e.clientY); });
document.addEventListener("mouseup", () => dEnd(false));
document.addEventListener("click", e => { if (performance.now() < NOCLICK){ e.preventDefault(); e.stopPropagation(); } }, true);

/* click delegation */
document.addEventListener("click", e => {
  const m = e.target.closest("[data-m]");
  if (m && m.closest("#mod")) { MOD[m.dataset.m](); return; }
  const el = e.target.closest("[data-a]"); if (!el || !document.getElementById("app").contains(el)) return;
  if (el.disabled) return;
  e.preventDefault();
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});

};

document.addEventListener("keydown", e => { if (e.key==="`") toggleMod(); });

/* iPhone 17 틀을 창 크기에 맞춰 줄이기 (레이아웃은 402 × 874 그대로) */
let PHS = 1;
function fitPhone(){
  const ph = $("#phone"), st = $("#stage");
  if (getComputedStyle(ph).getPropertyValue("--framed").trim() !== "1"){ PHS = 1; ph.style.transform = ""; ph.style.margin = ""; return; }
  const cs = getComputedStyle(st), W = ph.offsetWidth, H = ph.offsetHeight;
  const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 8;
  const ah = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 16;
  PHS = Math.min(1, aw / W, ah / H);
  ph.style.transform = PHS < 1 ? `scale(${PHS})` : "";
  ph.style.margin = PHS < 1 ? `${(H * PHS - H) / 2}px ${(W * PHS - W) / 2}px` : "";
}
addEventListener("resize", fitPhone); fitPhone();
// 사진은 data URI를 한 번만 blob URL로 바꿔 둔다(다시 그릴 때마다 긴 문자열을 비교하지 않게)
if (DATA.img){ const toBlob = d => { const i = d.indexOf(","), bin = atob(d.slice(i + 1)), u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return URL.createObjectURL(new Blob([u], {type: d.slice(5, d.indexOf(";"))})); };
  DATA.img = {main: toBlob(DATA.img.main), thumbs: DATA.img.thumbs.map(toBlob), defect: DATA.img.defect && Object.fromEntries(Object.entries(DATA.img.defect).map(([k, v]) => [k, toBlob(v)])), angle: DATA.img.angle && Object.fromEntries(Object.entries(DATA.img.angle).map(([k, v]) => [k, toBlob(v)]))}; }
document.body.classList.toggle("photo", !!DATA.img);
log(`시작 · 상품 상세 (TO-BE · 세트 ${SET})`);
render();
